[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dlpacker_pytorch"
version = "0.0.1"
description = "PyTorch reimplementation of DLPacker."
authors = ["Mikita Misiura <emall@address>"]

readme = "README.md"
license = "MIT"
repository = "https://github.com/YaoYinYing/DLPacker"
classifiers = [
    "Topic :: Scientific/Engineering :: Biochemistry",
    "Topic :: Scientific/Engineering :: Protein Engineering"
]

packages = [
    { include = "dlpacker_pytorch" },
]

[tool.poetry.dependencies]

python = ">=3.10,<3.14"
biopython = ">=1.78"
torch = ">=2.3"

numpy = "^1.19.2"

pooch = "1.8.0"
h5py = "*"
py7zr = "0.20.8"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"

[tool.pytest.ini_options]
markers = [
  "tf_parity: TensorFlow-vs-PyTorch parity checks (optional; requires TensorFlow)."
]

[tool.black]
line-length = 79
target-version = ['py38']
skip-string-normalization = true

include = '''
/(
  | dlpacker_pytorch
)/
'''

exclude = "dlpacker_pytorch/data"
